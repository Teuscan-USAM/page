<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso SSH</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <nav class="site-nav" aria-label="Navegación principal">
        <a class="brand" href="index.html">SSH<span>/</span>TOOL</a>
        <div class="nav-links">
            <a class="nav-link is-active" href="index.html">Claves SSH</a>
            <a class="nav-link" href="soporte.html">Soporte técnico</a>
        </div>
    </nav>
    <p class="eyebrow">Panel seguro</p>
    <h1>Acceso SSH</h1>
    <p class="intro">Introduce una URL para preparar los datos de acceso.</p>
    <section class="panel" aria-labelledby="form-title">
        <form id="access-form">
            <label id="form-title" for="url">URL del servidor</label>
            <div class="input-row">
                <input id="url" name="url" type="url" placeholder="https://ejemplo.com" required>
                <button type="submit">Continuar</button>
            </div>
        </form>
        <section id="credentials-panel" class="credentials-panel hidden" aria-live="polite">
            <div class="success-header">
                <div class="status-badge"><span class="status-dot"></span><span>ÉXITO</span></div>
                <h2>¡Credenciales generadas!</h2>
                <span class="status-pill"><span class="status-dot"></span> LISTO</span>
            </div>
            <div class="credentials-list">
                <div class="credential-card"><span class="credential-label">ACCESO SSH</span><div class="credential-line"><strong id="ssh-generated">—</strong><button class="copy-button" data-copy-target="ssh-generated" type="button" disabled>COPIAR</button></div></div>
                <div class="credential-card"><span class="credential-label">FORMATO SIS</span><div class="credential-line"><strong id="siap-generated">—</strong><button class="copy-button" data-copy-target="siap-generated" type="button" disabled>COPIAR</button></div></div>
                <div class="credential-card"><span class="credential-label">FORMATO SIAP</span><div class="credential-line"><strong id="sis-generated">—</strong><button class="copy-button" data-copy-target="sis-generated" type="button" disabled>COPIAR</button></div></div>
                <div class="credential-card"><span class="credential-label">Formato basesiap</span><div class="credential-line"><strong>basesiap</strong><button class="copy-button" data-copy-value="basesiap" type="button" disabled>COPIAR</button></div></div>
                <div class="credential-card"><span class="credential-label">Formato b4s3s14p</span><div class="credential-line"><strong>b4s3s14p</strong><button class="copy-button" data-copy-value="b4s3s14p" type="button" disabled>COPIAR</button></div></div>
            </div>
        </section>
    </section>
</main>
<script src="app.js"></script>
</body>
</html>
